<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintEase Admin</title><style>
*{box-sizing:border-box}body{font-family:Arial;background:#f3f6fb;margin:0;color:#18233a}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;padding:18px;margin:12px 0;border-radius:18px;box-shadow:0 4px 18px #0001}input,select,button{padding:10px;margin:4px;border-radius:9px;border:1px solid #d8deea}button{background:#1769e0;color:#fff;border:0;font-weight:700}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef4ff;padding:14px;border-radius:14px}.num{font-size:25px;font-weight:800}.order{background:#fff;padding:16px;margin:10px 0;border-radius:15px;box-shadow:0 2px 12px #0001}.tools{display:flex;flex-wrap:wrap;gap:5px}.download{display:inline-block;background:#eef4ff;color:#1769e0;padding:9px;border-radius:8px;text-decoration:none;font-weight:700}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div id="login" class="card"><h1>🏪 PrintEase Shop Admin</h1><input id="u" value="admin" placeholder="Username"><input id="p" type="password" value="admin123" placeholder="Password"><button onclick="go()">Login</button></div><div id="dash" class="hide"><div class="card"><h1>🖨️ Shop Dashboard</h1><button onclick="loadAll()">Refresh</button><button onclick="out()">Logout</button></div><div class="stats"><div class="stat">Today's orders<div id="s1" class="num">0</div></div><div class="stat">Today's revenue<div id="s2" class="num">₹0</div></div><div class="stat">Pages/copies<div id="s3" class="num">0</div></div><div class="stat">Ready now<div id="s4" class="num">0</div></div></div><div class="card"><h2>Pricing Settings</h2><div id="rates"></div><button onclick="saveRates()">Save Rates</button></div><div id="orders"></div></div></div>
<script>const $=id=>document.getElementById(id);async function api(u,o={}){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function go(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});$('login').classList.add('hide');$('dash').classList.remove('hide');loadAll()}catch(e){alert(e.message)}}
async function loadAll(){try{let s=await api('/api/admin/stats');$('s1').textContent=s.orders;$('s2').textContent='₹'+s.revenue;$('s3').textContent=s.pages;$('s4').textContent=s.ready;let j=await api('/api/admin/orders');$('orders').innerHTML=j.orders.map(x=>`<div class="order"><h2>${x.token}</h2><b>${x.name||''}</b> ${x.phone||''}<br>${x.filename}<br>${x.pages} pages × ${x.copies} • ${x.color} • ${x.sides} • ${x.paper}<br><b>₹${Number(x.total).toFixed(2)}</b> • ${x.paid?'Paid':'Unpaid'}<div class="tools"><select onchange="st('${x.token}',this.value)">${['Waiting','Printing','Ready','Collected','Cancelled'].map(v=>`<option ${v==x.status?'selected':''}>${v}</option>`).join('')}</select><button onclick="pd('${x.token}',${x.paid?0:1})">${x.paid?'Mark Unpaid':'Mark Paid'}</button><a class="download" href="/files/${encodeURIComponent(x.stored)}">Download Document</a></div></div>`).join('')||'<div class="card">No orders.</div>';let rr=await api('/api/admin/rates');let keys=['bw_single','bw_double','color_single','color_double','a3_extra','service','first_discount'];$('rates').innerHTML=keys.map(k=>`<label>${k}: <input id="r_${k}" type="number" step="0.01" value="${rr.rates[k]}"></label>`).join('')}catch(e){alert(e.message)}}
async function st(t,s){await api('/api/admin/order/'+t+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});loadAll()}async function pd(t,p){await api('/api/admin/order/'+t+'/paid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paid:!!p})});loadAll()}async function saveRates(){let keys=['bw_single','bw_double','color_single','color_double','a3_extra','service','first_discount'],z={};keys.forEach(k=>z[k]=$('r_'+k).value);await api('/api/admin/rates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(z)});alert('Rates saved');loadAll()}async function out(){await api('/api/admin/logout',{method:'POST'});location.reload()}setInterval(()=>{if(!$('dash').classList.contains('hide'))loadAll()},10000)</script></body></html>
