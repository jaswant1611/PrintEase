<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintEase</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#18233a}.wrap{max-width:620px;margin:auto;padding:16px}.card{background:#fff;padding:18px;margin:12px 0;border-radius:18px;box-shadow:0 4px 18px #0001}input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #d8deea;border-radius:11px;font-size:15px}button{background:#1769e0;color:#fff;border:0;font-weight:700}.secondary{background:#eef4ff;color:#1769e0}.hide{display:none}.price{font-size:30px;font-weight:800}.order{border:1px solid #e0e5ef;border-radius:14px;padding:13px;margin:10px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#1769e0;font-weight:700}.small{font-size:13px;color:#68748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ok{background:#eaf8ef;color:#176b37;padding:10px;border-radius:10px}
</style></head><body><div class="wrap">
<div id="auth" class="card"><h1>🖨️ PrintEase</h1><p class="small">Order your prints from campus. Collect when ready.</p><input id="phone" placeholder="Phone number"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><hr><input id="name" placeholder="Name (new account)"><button class="secondary" onclick="register()">Create Account</button></div>
<div id="app" class="hide"><div class="card"><h2>Hi <span id="nm"></span> 👋</h2><p class="small">Submit your document online and track the token.</p><button onclick="openForm()">+ New Print Order</button></div>
<div id="form" class="card hide"><h2>New Print Order</h2><input id="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt" onchange="fileChanged()"><div id="filemsg" class="small"></div><div class="row"><div><label>Pages</label><input id="pages" type="number" min="1" value="1" oninput="quote()"></div><div><label>Copies</label><input id="copies" type="number" min="1" value="1" oninput="quote()"></div></div><div class="row"><select id="color" onchange="quote()"><option>B&W</option><option>Color</option></select><select id="sides" onchange="quote()"><option>Single</option><option>Double</option></select></div><select id="paper" onchange="quote()"><option>A4</option><option>A3</option></select><div class="card"><div>Estimated total</div><div class="price">₹<span id="total">0.00</span></div><div id="bd" class="small"></div></div><button onclick="place()">Place Order</button><button class="secondary" onclick="form.classList.add('hide')">Cancel</button></div>
<div class="card"><h2>My Orders</h2><div id="list">Loading...</div></div><button class="secondary" onclick="logout()">Logout</button></div></div>
<script>
const $=id=>document.getElementById(id); async function api(u,o={}){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function login(){try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('phone').value,password:$('pass').value})});start()}catch(e){alert(e.message)}}
async function register(){try{await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,phone:$('phone').value,password:$('pass').value})});alert('Account created. Now login.')}catch(e){alert(e.message)}}
async function start(){let j=await api('/api/me');if(j.logged_in){$('nm').textContent=j.name;$('auth').classList.add('hide');$('app').classList.remove('hide');load()}}
function openForm(){$('form').classList.remove('hide');quote()}
async function fileChanged(){let f=$('file').files[0];$('filemsg').textContent=f?('Selected: '+f.name):'';if(f&&f.name.toLowerCase().endsWith('.pdf')){let b=await f.arrayBuffer();let bytes=new Uint8Array(b),txt=new TextDecoder('latin1').decode(bytes);let m=txt.match(/\/Type\s*\/Page\b/g);if(m&&m.length){$('pages').value=m.length;$('filemsg').textContent+=' • Detected about '+m.length+' PDF pages';quote()}}}
async function quote(){try{let j=await api('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pages:$('pages').value,copies:$('copies').value,color:$('color').value,sides:$('sides').value,paper:$('paper').value})});$('total').textContent=Number(j.total).toFixed(2);$('bd').textContent=`Printing ₹${j.printing} + service ₹${j.service} - discount ₹${j.discount}`+(j.member?' • Membership: service free':'')+(j.first_order?' • First order 50% OFF':'')}catch(e){}}
async function place(){let f0=$('file').files[0];if(!f0)return alert('Choose a file');let f=new FormData();f.append('file',f0);['pages','copies','color','sides','paper'].forEach(k=>f.append(k,$(k).value));try{let j=await api('/api/order',{method:'POST',body:f});alert('Order placed!\nToken: '+j.token+'\nTotal: ₹'+j.total+(j.auto_pages?'\nPDF pages detected: '+j.pages:''));$('form').classList.add('hide');load()}catch(e){alert(e.message)}}
async function load(){try{let j=await api('/api/orders');$('list').innerHTML=j.orders.length?j.orders.map(o=>`<div class="order"><b>${o.token}</b> <span class="pill">${o.status}</span><br>${o.filename}<br>${o.pages} pages × ${o.copies} • ${o.color} • ${o.sides} • ${o.paper}<br><b>₹${Number(o.total).toFixed(2)}</b> • ${o.paid?'Paid':'Payment pending'}</div>`).join(''):'No orders yet'}catch(e){}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}start();setInterval(()=>{if(!$('app').classList.contains('hide'))load()},10000)
</script></body></html>
